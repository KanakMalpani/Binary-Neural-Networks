name: wheels

# Manual dispatch is the normal path ("Run workflow" in the Actions tab).
# Tags build automatically so a release always has artifacts attached.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI after building (requires trusted publishing to be configured)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned so a cibuildwheel release cannot silently change what we ship.
  # Target selection lives in [tool.cibuildwheel] in pyproject.toml -- do not
  # set CIBW_BUILD here as well, or the two definitions can drift.
  CIBW_VERSION: "4.1.1"

jobs:
  wheels:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write       # OIDC token the attestation is signed with
      attestations: write   # write the provenance record to the repo
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-aarch64
          - os: windows-latest
            label: windows-amd64
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install --upgrade pip "cibuildwheel==${{ env.CIBW_VERSION }}"

      - name: Build wheels
        # Native runners for every arch, so no QEMU emulation is involved.
        run: python -m cibuildwheel --output-dir wheelhouse

      # W8.T07 — signed SLSA build provenance, so a consumer can verify a wheel
      # was built by this workflow from this commit:
      #   gh attestation verify bnn_lab-*.whl --repo KanakMalpani/Binary-Neural-Networks
      # (PyPI / pep440 normalises the dist name to bnn_lab in filenames.)
      # Skipped on forks, which cannot mint an OIDC token.
      - name: Attest build provenance
        if: github.repository == 'KanakMalpani/Binary-Neural-Networks'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: wheelhouse/*.whl

      - name: List built wheels
        run: >
          python -c "from pathlib import Path; wh=sorted(Path('wheelhouse').glob('*.whl'));
          assert wh, 'no wheels in wheelhouse/';
          [print(f'{p.name}\t{p.stat().st_size}') for p in wh]"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.label }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          python -m pip install -U pip build
          python -m build --sdist
      - name: Verify sdist compiles the kernel from source
        # --no-binary is scoped to bnn: `:all:` would force source builds of
        # numpy and torch too. --no-deps keeps torch out of this job entirely;
        # check_wheel_kernel.py needs only NumPy.
        run: |
          python -m pip install numpy
          python -m pip install --no-binary bnn-lab --no-deps dist/*.tar.gz
          python scripts/check_wheel_kernel.py
      - name: Attest build provenance
        if: github.repository == 'KanakMalpani/Binary-Neural-Networks'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Dry-run gate: always aggregates artifacts after a successful build so a
  # publish=false dispatch still proves wheels + sdist + attestations landed.
  # Does not upload to PyPI. Do not invent an API-token publish path.
  package-check:
    needs: [wheels, sdist]
    if: always() && needs.wheels.result == 'success' && needs.sdist.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Summarise artifacts (dry-run)
        run: |
          set -euo pipefail
          echo "## wheels dry-run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| file | bytes |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"
          found=0
          for f in dist/*; do
            [ -f "$f" ] || continue
            found=1
            printf '| `%s` | %s |\n' "$(basename "$f")" "$(wc -c < "$f" | tr -d ' ')" >> "$GITHUB_STEP_SUMMARY"
            ls -la "$f"
          done
          test "$found" -eq 1
          # Dist name on disk is bnn_lab (underscore); import/CLI stay `bnn`.
          ls dist/bnn_lab-*.whl dist/bnn_lab-*.tar.gz >/dev/null
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Publish skipped unless \`workflow_dispatch\` + \`publish=true\` + Trusted Publisher." >> "$GITHUB_STEP_SUMMARY"

  publish:
    # Never fires on its own: requires a human to dispatch with publish=true.
    # Requires PyPI Trusted Publisher for project `bnn-lab` → this repo /
    # wheels.yml / environment `pypi`. OIDC only — no API token path.
    needs: [wheels, sdist, package-check]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC for trusted publishing; no API token stored
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
