name: scorecard

# OpenSSF Scorecard grades supply-chain posture (branch protection, pinned
# deps, code scanning, ...) and publishes the badge shown in the README.
# Public repositories only.
on:
  branch_protection_rule:
  schedule:
    - cron: "18 5 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Job-level permissions replace workflow defaults — keep contents/actions
    # readable so checkout + SARIF upload work after publish_results.
    permissions:
      contents: read
      actions: read
      security-events: write   # upload SARIF to the Security tab
      id-token: write          # publish results for the badge (public repos only)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: results.sarif
