name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

jobs:
  quality:
    # Lint + types + coverage. Fast, runs first, no native toolchain needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Ruff (hard gate)
        run: ruff check .
      - name: Mypy (hard gate)
        run: mypy
      - name: Pytest + coverage (hard floor 80%)
        run: |
          pytest -q -m "not slow and not hf" \
            --cov=bnn --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=80
      - name: Knowledge graph integrity
        run: |
          python scripts/kg_validate.py
          pytest -q tests/test_kg.py
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  docs:
    # W9.T06 — the API reference is generated from docstrings, so a renamed
    # symbol must break the build rather than silently empty a page.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,docs]" -c constraints.txt
      - name: Docs integrity (links, nav, autodoc refs)
        run: pytest -q tests/test_docs_links.py
      - name: Build site
        run: mkdocs build --strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: site/
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Compile native (MSVC)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" 2>nul || call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat" 2>nul || call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          python -m bnn.kernels.compile_native
        # Soft: vcvars path varies across GHA images; NumPy path still gated by pytest.
        continue-on-error: true
      - name: Pytest (fast)
        run: pytest -q -m "not slow and not hf"
      - name: Export check
        run: python scripts/export_check.py
      - name: Repro verify (gates must pass)
        run: python scripts/repro_all.py --mode verify --skip-compile --skip-pytest

  linux-native:
    # Hard gate: Linux GCC .so must build + validate (W2.T03 / W8.T10).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libomp-dev
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Compile native (GCC OpenMP)
        run: python -m bnn.kernels.compile_native --force
      - name: Validate native (err=0, every ISA path)
        run: python scripts/validate_native.py
      - name: Pytest (fast; native present)
        run: pytest -q -m "not slow and not hf"
      - name: Export check
        run: python scripts/export_check.py
      - name: Repro verify (goldens must pass)
        run: python scripts/repro_all.py --mode verify --skip-compile --skip-pytest
      - name: Pareto smoke
        run: python scripts/pareto_report.py --demo --out results/_ci_pareto.json

  portability:
    # "Usable worldwide by anyone": the same source must build and agree on
    # x86-64 and ARM64, Linux and macOS. ARM exercises the NEON path; the
    # forced-scalar run proves the fallback every unknown CPU will take.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            label: linux-arm64-neon
          - os: macos-latest
            label: macos-arm64-neon
          - os: macos-15-intel
            label: macos-x86_64
    runs-on: ${{ matrix.os }}
    name: portability (${{ matrix.label }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      # macOS: do not brew-install libomp for CI. PyTorch already ships an
      # OpenMP runtime; a second libomp aborts validate_native (OMP Error #15).
      # compile_native.default_openmp() is False on Darwin — SIMD still runs.
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" -c constraints.txt
      - name: "Compile native (macOS, no OpenMP)"
        if: startsWith(matrix.os, 'macos')
        run: python -m bnn.kernels.compile_native --force --no-openmp
      - name: "Compile native (Linux)"
        if: startsWith(matrix.os, 'ubuntu')
        run: python -m bnn.kernels.compile_native --force
      - name: Validate native (cross-ISA err=0)
        run: python scripts/validate_native.py
      - name: Pytest (fast)
        run: pytest -q -m "not slow and not hf"
      - name: Pytest with kernel forced to scalar
        # Every machine has this path; it must stay bit-identical to SIMD.
        env:
          BNN_KERNEL: scalar
        run: pytest -q -m "not slow and not hf" tests/test_native_gemm.py tests/test_ternary_gemm.py
      - name: Export check
        run: python scripts/export_check.py

  linux-py-matrix:
    # W8.T03 / W14.T02 — Python 3.11–3.13 smoke (NumPy path; native optional).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" -c constraints.txt
      - name: Compile native (best-effort)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc libomp-dev || true
          python -m bnn.kernels.compile_native --force || true
      - name: Pytest (fast)
        run: pytest -q -m "not slow and not hf"
      - name: Export check
        run: python scripts/export_check.py

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" -c constraints.txt
          pip install pip-audit
      # W10.T05 — hard gate on the *shipped* dependency set.
      #
      # Audits requirements.txt rather than the whole environment: pip-audit
      # itself drags in requests/urllib3, and failing the build on our auditing
      # tool's transitive deps is noise, not security.
      #
      # Any advisory NOT listed below fails the build. Each ignore is triaged,
      # with the condition for removing it — see docs/SBOM.md.
      #
      #   PYSEC-2025-194  torch <2.13. Fixed in 2.13.0, which is outside the
      #                   supported range (`torch>=2.1,<2.13`); the range is
      #                   what keeps the macOS x86_64 runner installable.
      #                   Drop this ignore when the torch cap moves past 2.13.
      #   PYSEC-2026-3447 setuptools <83. Build-time only — not imported at
      #                   runtime and not shipped in the wheel. Drop when the
      #                   runner image ships setuptools >= 83.
      - name: pip-audit (hard gate on shipped deps)
        run: |
          pip-audit --strict --progress-spinner off \
            --requirement requirements.txt \
            --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln PYSEC-2026-3447
      # Report-only sweep of the full environment so new findings are visible
      # in the log without gating on our own tooling's dependencies.
      - name: pip-audit (full environment, report only)
        run: pip-audit --progress-spinner off || true
        continue-on-error: true
      - name: SBOM smoke
        run: python scripts/generate_sbom.py --out sbom.json
