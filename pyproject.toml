[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name. Import path and console script remain `bnn`.
# The short name `bnn` is already taken on PyPI (unrelated package by Adrian Bulat).
name = "bnn-lab"
version = "0.3.0"
description = "Extreme low-bit inference lab: packed binary/ternary CPU kernels + STE training (honest CPU/edge speedups)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Binary Neural Network Lab" }]
keywords = [
  "binary-neural-network",
  "ternary",
  "xnor",
  "popcount",
  "quantization",
  "edge-ai",
  "cpu-inference",
  "ste",
  "bitnet",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1,<2.13",
  "numpy>=1.24,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
  "pytest-timeout>=2.2,<3",
  "pytest-cov>=4.1,<8",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
]
vision = []  # CIFAR/MNIST loaders are stdlib+torch; reserved for future torchvision
audio = []   # Synthetic audio is NumPy-only; reserved for real ASR deps
# safetensors: soft dep for Lane B packed export (`bnn.codec.safetensors_export`);
# import is optional at runtime — listed here so `pip install bnn-lab[hf]` has it.
hf = [
  "transformers>=4.40,<5",
  "datasets>=2.18,<4",
  "huggingface_hub>=0.22,<1",
  "safetensors>=0.4,<1",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
  "mkdocstrings[python]>=0.26,<1",
]
all = ["bnn-lab[dev,hf,docs]"]

[project.scripts]
bnn = "bnn.cli:main"

[project.urls]
Homepage = "https://github.com/KanakMalpani/Binary-Neural-Networks"
Documentation = "https://github.com/KanakMalpani/Binary-Neural-Networks/blob/main/REPRODUCIBILITY.md"
Repository = "https://github.com/KanakMalpani/Binary-Neural-Networks"
Changelog = "https://github.com/KanakMalpani/Binary-Neural-Networks/blob/main/CHANGELOG.md"
# Live once Trusted Publisher uploads; badge + URL are intentional pre-publish.
PyPI = "https://pypi.org/project/bnn-lab/"
"Reproduce results" = "https://github.com/KanakMalpani/Binary-Neural-Networks/blob/main/REPRODUCIBILITY.md"
"Agent entrypoint" = "https://github.com/KanakMalpani/Binary-Neural-Networks/blob/main/AGENTS.md"
"Publish runbook" = "https://github.com/KanakMalpani/Binary-Neural-Networks/blob/main/docs/PYPI_PUBLISH.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["bnn*"]

[tool.setuptools.package-data]
bnn = ["py.typed", "kernels/*.c", "kernels/*.def", "kernels/*.py", "zoo_registry.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "slow: longer trains / downloads (deselect with -m 'not slow')",
  "native: requires MSVC native DLL",
  "hf: optional Hugging Face / transformers (deselect with -m 'not hf')",
  "optional_extras: transformers/torchao smoke (deselect with -m 'not optional_extras')",
]

[tool.cibuildwheel]
# Wheels exist so that `pip install bnn-lab` yields the fast kernel with no
# compiler on the user's machine. The smoke test runs against the *shipped*
# binary and needs only NumPy — pulling torch into every wheel's test env would
# cost ~200 MB per target and is not available on all of them.
build-frontend = "build"
# Single source of truth for target versions — matches the classifiers and the
# CI matrix. Do not also set CIBW_BUILD in the workflow or the two can drift.
build = ["cp311-*", "cp312-*", "cp313-*"]
# PyPy: no torch (and not in build=). i686/win32: 32-bit WinError 193 trap.
# Free-threaded (t): unreliable NumPy. musllinux: PyTorch has no musl wheels, so
# `pip install bnn-lab` cannot succeed. cp313 macOS x86_64: same (no torch wheel).
skip = [
  "*_i686",
  "*-win32",
  "*t-*",
  "*musllinux*",
  "cp313-macosx_x86_64",
]
test-requires = ["numpy"]
test-command = "python {project}/scripts/check_wheel_kernel.py"

[tool.cibuildwheel.macos]
# Match docs/MACOS_NOTES.md + CI portability: do NOT brew-install libomp.
# Current Homebrew bottles require macOS 26+, which delocate rejects against
# MACOSX_DEPLOYMENT_TARGET=11.0. SIMD (NEON/AVX2) still ships; OpenMP is
# threading-only and opt-in via BNN_FORCE_OPENMP for local builds.
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0", BNN_NO_OPENMP = "1" }

[tool.cibuildwheel.windows]
# MSVC /openmp links vcomp*.dll; ctypes wheel smoke cannot always resolve it
# in the isolated test venv. SIMD paths remain; OpenMP is local/dev opt-in.
environment = { BNN_NO_OPENMP = "1" }

[tool.cibuildwheel.linux]
before-all = "yum install -y libgomp || apk add --no-cache libgomp || true"

[tool.coverage.run]
source = ["bnn"]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["bnn.egg-info", "dist", "data", "checkpoints"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "W",     # pycodestyle warnings
  "I",     # import sorting
  "UP",    # pyupgrade
  "B",     # bugbear (mutable defaults, loop-variable capture, ...)
  "C4",    # comprehensions
  "SIM",   # simplify
  "RET",   # return hygiene
  "NPY",   # NumPy-specific correctness
  "PIE",
  "PT",    # pytest style
]
ignore = [
  "E501",    # long lines: enforced at 100 above; legacy prose lines exempted below
  "SIM108",  # ternaries are not always clearer than if/else here
  "RET504",  # named result before return often documents intent
  "PT011",   # broad pytest.raises(ValueError) is fine for this codebase
  "PT006",   # "B,N,M" parametrize strings are valid pytest and used throughout
  "PT018",   # compound asserts read better than split ones in the numeric gates
]

[tool.ruff.lint.per-file-ignores]
# Scripts and tests intentionally sys.path-hack before importing bnn.
"scripts/*" = ["E402"]
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["bnn"]

[tool.mypy]
python_version = "3.11"
files = ["bnn"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
# warn_unreachable is deliberately off: torch types nn.Module.__getattr__ as
# returning `Tensor | Module`, so any `if module.bias is None` narrows to a
# branch mypy then calls unreachable. It reported 10 such false positives here
# and no true ones. Revisit if torch's stubs improve.
warn_unreachable = false
