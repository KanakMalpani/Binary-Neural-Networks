site_name: Binary Neural Network Optimiser
site_description: Honest packed binary/ternary CPU/edge optimiser lab
site_url: https://kanakmalpani.github.io/Binary-Neural-Networks/
repo_url: https://github.com/KanakMalpani/Binary-Neural-Networks
repo_name: Binary-Neural-Networks

# Autodoc site (W9.T05 + W9.T06 complete).
#   pip install -e ".[docs]" && mkdocs build --strict
# Note: root README / ROADMAP are linked from docs pages, not duplicated here.

theme:
  name: material
  palette:
    primary: blue grey
    accent: teal

nav:
  - Docs index: README.md
  - End-to-end guide: GUIDE_E2E.md
  - Optimiser quickstart: tutorials/07_OPTIMISER_QUICKSTART.md
  - HF optimiser: tutorials/08_HF_OPTIMISER.md
  - Hub .bnnpack canaries: HUB_BNNPACK.md
  - Demos: demos/README.md
  - API reference:
      - Overview: api/README.md
      - Optimiser: api/optimise.md
      - Wrapping models: api/wrap.md
      - Kernels: api/kernels.md
      - Layers & STE: api/layers.md
      - Encoder / decoder: api/seq.md
      - Weight codec: api/codec.md
      - Paths & safety: api/paths.md
      - Reporting & repro: api/reporting.md
  - ADRs: adr/README.md
  - Semver policy: SEMVER_AND_DEPRECATION.md
  - Torch pin policy: TORCH_PIN_POLICY.md
  - Optional extras: OPTIONAL_EXTRAS_MATRIX.md
  - Portable SIMD kernel: 41_PORTABLE_SIMD_KERNEL.md
  - QAT + layer search: 42_QAT_AND_LAYER_SEARCH.md
  - Memory footprint: 43_MEMORY_FOOTPRINT.md
  - Knowledge graph: 44_KNOWLEDGE_GRAPH.md
  - Improvement handoff: 45_IMPROVEMENT_ROADMAP_HANDOFF.md
  - Transformation plan: TRANSFORMATION_PLAN.md
  - World-class roadmap: 37_WORLD_CLASS_BNN_OPTIMISER_ROADMAP.md

docs_dir: docs

# README / ROADMAP / REPRODUCIBILITY / AGENTS live at the repo root on purpose
# (AGENTS.md points agents at them), so docs pages link upward out of docs_dir
# and MkDocs cannot resolve those targets. Link integrity is instead enforced
# repo-wide by tests/test_docs_links.py, which does understand the layout —
# so --strict still catches nav and autodoc errors without false positives here.
validation:
  links:
    not_found: ignore

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 3
            show_root_heading: true
            show_root_full_path: false
            filters: ["!^_"]
